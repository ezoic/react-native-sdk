name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # `prepare` builds lib/ and downloads the bundled iOS SDK.
      - run: npm ci

      # @ezoic/react-native-cmp-sdk (cmp/) uses the root's dev dependencies;
      # only its iOS framework needs fetching.
      - run: node scripts/fetch-ios-sdk.js --package cmp

      - run: node scripts/fetch-ios-sdk.js --check

      - run: node scripts/fetch-ios-sdk.js --package cmp --check

      # Typecheck, lint and tests cover both packages.
      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm pack --pack-destination "$RUNNER_TEMP"

      - run: npm pack --pack-destination "$RUNNER_TEMP"
        working-directory: cmp

      - name: Verify the tarballs bundle the iOS SDK
        run: |
          check() {
            local tarball="$1"; shift
            local files
            files="$(tar -tzf "$tarball")"
            for f in "$@"; do
              if ! grep -qxF "$f" <<< "$files"; then
                echo "::error::$(basename "$tarball") is missing $f"
                exit 1
              fi
            done
          }
          slices() {
            local framework="$1"
            local dir="package/ios/Frameworks/$framework.xcframework"
            echo "$dir/Info.plist"
            echo "$dir/ios-arm64/$framework.framework/$framework"
            echo "$dir/ios-arm64_x86_64-simulator/$framework.framework/$framework"
          }
          # Paths have no spaces, so word splitting is safe here.
          check "$RUNNER_TEMP"/ezoic-react-native-sdk-*.tgz \
            $(slices EzoicAdsSDKBinary) $(slices EzoicCmpSDKBinary)
          check "$RUNNER_TEMP"/ezoic-react-native-cmp-sdk-*.tgz \
            $(slices EzoicCmpSDKBinary) package/lib/module/index.js package/EzoicReactNativeCmpSdk.podspec
