name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # `prepare` builds lib/ and downloads the bundled iOS SDK.
      - run: npm ci

      # @ezoic/react-native-cmp-sdk (cmp/) uses the root's dev dependencies;
      # only its iOS framework needs fetching.
      - run: node scripts/fetch-ios-sdk.js --package cmp

      - run: node scripts/fetch-ios-sdk.js --check

      - run: node scripts/fetch-ios-sdk.js --package cmp --check

      # Typecheck, lint and tests cover both packages.
      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm pack --pack-destination "$RUNNER_TEMP"

      - run: npm pack --pack-destination "$RUNNER_TEMP"
        working-directory: cmp

      - name: Verify the tarballs bundle the iOS SDK
        run: |
          check() {
            local tarball="$1"; shift
            local files
            files="$(tar -tzf "$tarball")"
            for f in "$@"; do
              if ! grep -qxF "$f" <<< "$files"; then
                echo "::error::$(basename "$tarball") is missing $f"
                exit 1
              fi
            done
          }
          slices() {
            local framework="$1"
            local dir="package/ios/Frameworks/$framework.xcframework"
            echo "$dir/Info.plist"
            echo "$dir/ios-arm64/$framework.framework/$framework"
            echo "$dir/ios-arm64_x86_64-simulator/$framework.framework/$framework"
          }
          # Paths have no spaces, so word splitting is safe here.
          check "$RUNNER_TEMP"/ezoic-react-native-sdk-*.tgz \
            $(slices EzoicConsentCoreBinary) $(slices EzoicAdsSDKBinary) $(slices EzoicCmpSDKBinary)
          check "$RUNNER_TEMP"/ezoic-react-native-cmp-sdk-*.tgz \
            $(slices EzoicConsentCoreBinary) $(slices EzoicCmpSDKBinary) \
            package/lib/module/index.js package/EzoicReactNativeCmpSdk.podspec

  # Builds a fresh React Native app that installs the packed
  # @ezoic/react-native-sdk (scripts/smoke-app.sh), with the built-in CMP
  # (default) and with `"ezoic": { "includeCmp": false }` in the app's
  # package.json. The script fails unless the CMP is in the app exactly when
  # expected: Android counts the EzoicCmp class in the APK's dex; iOS checks
  # the app binary for EZBuiltInCmpProvider (the ads binary finds it by name at
  # runtime, so a missing link reference would otherwise go unnoticed) and,
  # without the CMP, for any EzoicCmpSDKBinary symbol or framework.
  smoke:
    name: smoke (${{ matrix.platform }}, includeCmp=${{ matrix.include-cmp }})
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
        include-cmp: ['true', 'false']
    runs-on: ${{ matrix.platform == 'ios' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: actions/setup-java@v5
        if: matrix.platform == 'android'
        with:
          distribution: zulu
          java-version: '17'

      - name: Select Xcode 26.6
        if: matrix.platform == 'ios'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      # `prepare` builds lib/ and downloads the bundled iOS SDK.
      - run: npm ci

      - name: Build the smoke app
        env:
          EZOIC_SMOKE_INCLUDE_CMP: ${{ matrix.include-cmp }}
        run: scripts/smoke-app.sh ads "$RUNNER_TEMP/smoke" ${{ matrix.platform }}
